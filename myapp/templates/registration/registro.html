{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}Crear cuenta{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-1">Crear cuenta</h1>
                <p class="text-muted mb-4">Con tu cuenta podras reservar recursos y consultar tu historial.</p>
                <form method="post">
                    {% csrf_token %}
                    {% bootstrap_form form %}
                    <button class="btn btn-primary w-100" type="submit">Registrarme</button>
                </form>
                <p class="text-center text-muted mt-3 mb-0">
                    Ya tienes cuenta?
                    <a href="{% url 'login' %}">Ingresar</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
